version: '3.8'

services:
  iptv:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - iptv-data:/app/data
    environment:
      - IPTV_PORT=5000
      - IPTV_DATA_DIR=/app/data
    restart: unless-stopped

  # Jellyfin media server for end-to-end testing (Phase 4). Consumes SIGNAL's
  # Live TV (M3U tuner + XMLTV) and the STRM library. Reads SIGNAL's data volume
  # read-only at /signal so /signal/library is scannable as a Movies/TV library.
  # Enable with:  docker compose --profile jellyfin up
  jellyfin:
    image: jellyfin/jellyfin:latest
    profiles: ["jellyfin"]
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - iptv-data:/signal:ro
    depends_on:
      - iptv
    restart: unless-stopped

  # Optional Torznab indexer sidecar (Phase 2, IDX-02). Runs as a SEPARATE
  # service reached over HTTP — never linked into the Rust binary (indexarr-rs
  # is AGPL-3.0). Source legality is the operator's responsibility: configure
  # only legal indexers. Add it in SIGNAL via POST /api/indexers with
  # { "name": "indexarr", "kind": "torznab", "base_url": "http://indexarr:8080" }.
  # Enable with:  docker compose --profile indexer up
  indexarr:
    image: ghcr.io/ausagentsmith-org/indexarr-rs:latest
    profiles: ["indexer"]
    ports:
      - "8191:8080"
    volumes:
      - indexarr-data:/data
    restart: unless-stopped

volumes:
  iptv-data:
  indexarr-data:
  jellyfin-config:
  jellyfin-cache:
